name: offline-portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q -c pyproject.toml
