name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Wheel smoke
        run: |
          python -m venv /tmp/hsd-smoke
          /tmp/hsd-smoke/bin/python -m pip install --upgrade pip
          /tmp/hsd-smoke/bin/pip install dist/*.whl
          /tmp/hsd-smoke/bin/hermes-system-doctor version
          /tmp/hsd-smoke/bin/hermes-system-doctor discover --hermes-home tests/fixtures/hermes_home_minimal --json
